# Config Fly.io del backend — deploy desde la raíz del repo:
#   fly deploy -c fly.backend.toml
# El contexto de build es el directorio actual (raíz), requerido por backend/Dockerfile.

app = "fidelity-card-backend"
primary_region = "mad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    # Grace amplio: las migraciones Drizzle corren al boot antes de servir
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
