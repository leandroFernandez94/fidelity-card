# Config Fly.io del frontend — deploy desde la raíz del repo:
#   fly deploy -c fly.frontend.toml
# El contexto de build es el directorio actual (raíz), requerido por frontend/Dockerfile.

app = "fidelity-card-frontend"
primary_region = "cdg"

[build]
  dockerfile = "frontend/Dockerfile"

[env]
  # DNS interno de Fly (6PN): solo alcanzable dentro de la org
  API_UPSTREAM = "http://fidelity-card-backend.internal:3001"
  PORT = "80"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
