# Gated production deploy (Fly.io).
# Trigger: the CI workflow completes successfully on master. The deploy job
# then waits for the required reviewer of the "production" environment
# (Settings > Environments > production) before running flyctl.
# Required repository secrets (scoped deploy tokens, do NOT reuse one for both apps):
#   FLY_API_TOKEN_BACKEND   -> fly tokens create deploy -a fidelity-card-backend
#   FLY_API_TOKEN_FRONTEND  -> fly tokens create deploy -a fidelity-card-frontend
# Migrations apply automatically at backend container boot (see backend/Dockerfile),
# so approving a deployment approves its database migrations too.
name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend + frontend to Fly.io
    # Deploy only the exact commit that passed CI on master, from this repo
    # (never a fork's CI run).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v3

      - name: Deploy backend (migrations run at boot)
        run: flyctl deploy -c fly.backend.toml --token ${{ secrets.FLY_API_TOKEN_BACKEND }}

      - name: Deploy frontend
        run: flyctl deploy -c fly.frontend.toml --token ${{ secrets.FLY_API_TOKEN_FRONTEND }}
