# Continuous integration for the Bun workspaces monorepo.
# Single job on purpose: bun install is fast and cached by setup-bun,
# and the `tsc -b` project-references build is shared by the backend
# typecheck and the frontend build steps.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-install

      - name: Lint
        run: bun run lint

      - name: Build workspace types
        run: bunx tsc -b

      - name: Backend typecheck
        working-directory: backend
        run: bun run typecheck

      - name: Backend tests
        working-directory: backend
        run: bun run test

      - name: Frontend build
        working-directory: frontend
        run: bun run build
